name: lint-and-unit-tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch:

jobs:
  build-and-test-python:
    runs-on: ubuntu-22.04
    # Services section copied from https://github.com/StackStorm/st2/.github/workflows/ci.yaml#L446
    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017

      # In GHA, these services are started first before the code is checked out.
      # We need to reconfigure RabbitMQ during ci-integration tests.
      # We rely on custom config and SSL certs that are in the repo.
      # Many images require config in env vars (which we can't change during the test job)
      # or they require config in entrypoint args (which we can't override for GHA services)
      # so we use RabbitMQ's conf.d feature to get config files from mounted volumes.
      rabbitmq:
        image: rabbitmq:4.2
        volumes:
          - /home/runner/rabbitmq_conf:/etc/rabbitmq/conf.d  # RABBITMQ_MOUNTED_CONF_DIR
        env:
          # tell rabbitmq to enable this by default
          RABBITMQ_PLUGINS: rabbitmq_management
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest

        # These are strictly docker options, not entrypoint args (GHA restriction)
        options: >-
          --name rabbitmq

        ports:
          # These 6 ports are exposed by rabbitmq (see https://www.rabbitmq.com/networking.html#ports)
          # host_port:container_port/protocol
          - 5671:5671/tcp   # AMQP SSL port
          - 5672:5672/tcp   # AMQP standard port
          - 15672:15672/tcp # Management: HTTP, CLI
          #- 15671:15671/tcp # Management: SSL port
          #- 25672:25672/tcp # inter-node or CLI
          #- 4369:4369/tcp   # epmd
          #

      redis:
        # Docker Hub image
        image: redis:8.6
        # Set health checks to wait until redis has started
        options: >-
          --name "redis"
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379/tcp

    strategy:
      fail-fast: false
      matrix:
        version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}

      - name: Clone StackStorm/st2 repo
        run: |
          make .clone_st2_repo

      - name: reconfigure rabbitmq
        timeout-minutes: 2  # may die if rabbitmq fails to start
        run: |
          pushd /tmp/st2
          scripts/github/configure-rabbitmq.sh
          popd

      - name: Download and install depedencies
        run: |
          PKGS=(
            libldap2-dev
            libsasl2-dev
            python3-virtualenv
          )
          sudo apt-get update
          sudo apt-get -y install ${PKGS[@]}
          make requirements

      - name: Run lint and tests (Python ${{ matrix.version }})
        run: |
          make .lint
          make .unit-tests

